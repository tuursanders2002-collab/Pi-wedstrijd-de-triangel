<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>De Grote Pi-Wedstrijd van De Triangel</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: #fff; text-align: center; padding: 30px; user-select: none; }
        .container { max-width: 680px; margin: 0 auto; background: #16213e; padding: 35px; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
        h1 { color: #e94560; margin-bottom: 5px; font-size: 28px; }
        .subtitle { color: #a8b2d1; margin-bottom: 25px; font-size: 16px; }
        .pi-display { font-size: 26px; font-family: monospace; background: #0f3460; padding: 15px; border-radius: 8px; margin: 20px 0; word-wrap: break-word; min-height: 40px; letter-spacing: 2px; max-height: 150px; overflow-y: auto; }
        input { font-size: 20px; padding: 12px; width: 85%; border-radius: 8px; border: none; text-align: center; margin-bottom: 15px; }
        button { font-size: 18px; padding: 12px 25px; background: #e94560; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:hover { background: #ff5773; }
        #status { font-size: 18px; font-weight: bold; min-height: 30px; margin: 15px 0; }
        #bestScoreBox { font-size: 15px; color: #4ecca3; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏆 De Grote Pi-Wedstrijd van De Triangel</h1>
    <p class="subtitle">Vul je voor- en achternaam in en typ zoveel mogelijk cijfers na <strong>3,</strong></p>
    
    <input type="text" id="playerName" placeholder="Jouw voor- en achternaam..." maxlength="40">
    
    <div class="pi-display" id="piDisplay">3,<span id="typedDigits"></span></div>
    
    <input type="text" id="digitInput" placeholder="Typ hier de cijfers (14159...)" autocomplete="off" inputmode="numeric">
    <div id="status"></div>
    <button onclick="resetGame()">Opnieuw proberen</button>
    <div id="bestScoreBox">Jouw beste score op deze computer voor deze naam: <strong id="personalBest">0</strong></div>
</div>

<script>
      const GOOGLE_FORM_URL = "https://docs.google.com/forms/d/e/" + "1FAIpQLSfpaTfJeiNSG1dSdcsTx-grQ7Ct4ZFOav4ZSjwNkLOkuZIukw/formResponse";
    const ENTRY_NAAM = "entry.1702011723";
    const ENTRY_SCORE = "entry.393660799";


    const PI_DECIMALS = "1415926535897932384626433832795028841971693993751058209749445923078164062862089986280348253421170679821480865132823066470938446095505822317253594081284811174502841027019385211055596446229489549303819644288109756659334461284756482337867831652712019091456485669234603486104543266482133936072602491412737245870066063155881748815209209628292540917153643678925903600113305305488204665213841469519415116094330572703657595919530921861173819326117931051185480744623799627495673518857527248912279381830119491298336733624406566430860213949463952247371907021798609437027705392171762931767523846748184676694051320005681271452635608277857713427577896091736371787214684409012249534301465495853710507922796892589235420199561121290219608640344181598136297747713099605187072113499999983729780499510597317328160963185950244594553469083026425223082533446850352619311881710100031378387528865875332083814206171776691473035982534904287554687311595628638823537875937519577818577805321712268066130019278766111959092164201989";
    
    let currentIndex = 0;
    let gameOver = false;
    let personalBest = 0;

    function getPlayerKey() {
        return 'triangelPiBest:' + nameInput.value.trim().toLocaleLowerCase('nl-BE').replace(/\s+/g, ' ');
    }

    function loadPersonalBest() {
        const key = getPlayerKey();
        personalBest = nameInput.value.trim() ? (Number(localStorage.getItem(key)) || 0) : 0;
        document.getElementById('personalBest').textContent = personalBest;
    }

    const inputField = document.getElementById('digitInput');
    const typedDisplay = document.getElementById('typedDigits');
    const statusText = document.getElementById('status');
    const nameInput = document.getElementById('playerName');
    const piDisplay = document.getElementById('piDisplay');
    loadPersonalBest();
    nameInput.addEventListener('input', loadPersonalBest);

    inputField.addEventListener('paste', function(e) {
        e.preventDefault();
        statusText.style.color = "#ffb703";
        statusText.textContent = "Vals spelen mag niet! Zelf typen a.u.b. 😉";
    });
    inputField.addEventListener('drop', function(e) { e.preventDefault(); });

    inputField.addEventListener('input', function() {
        if (gameOver) {
            this.value = this.value.slice(0, currentIndex);
            return;
        }

        if (nameInput.value.trim() === "") {
            this.value = "";
            statusText.style.color = "#ffb703";
            statusText.textContent = "Vul eerst hierboven je naam in voordat je begint!";
            nameInput.focus();
            return;
        }

        const val = this.value.replace(/[^0-9]/g, '');
        this.value = val;

        if (val.length > currentIndex + 1) {
            this.value = val.slice(0, currentIndex);
            return;
        }

        if (val.length > currentIndex) {
            const lastTyped = val[currentIndex];
            const expected = PI_DECIMALS[currentIndex];

            if (lastTyped === expected) {
                currentIndex++;
                typedDisplay.textContent = PI_DECIMALS.slice(0, currentIndex);
                piDisplay.scrollTop = piDisplay.scrollHeight;
                statusText.style.color = "#4ecca3";
                statusText.textContent = `Goed bezig! Huidige score: ${currentIndex}`;
                
                if (currentIndex === PI_DECIMALS.length) {
                    endGame("Ongelooflijk! Je hebt alle 1.000 cijfers gehaald!");
                }
            } else {
                endGame(`Fout! Je typte '${lastTyped}', maar het moest '${expected}' zijn.`);
            }
        }
    });

    function endGame(message) {
        gameOver = true;
        inputField.disabled = true;
        nameInput.disabled = true;
        statusText.style.color = "#e94560";
        
        const playerName = nameInput.value.trim();

        // Bewaar alleen een lokaal persoonlijk record als hulpmiddel op deze computer.
        // Elke poging wordt altijd ingestuurd; Google Sheets bepaalt de beste score per naam.
        if (currentIndex > personalBest) {
            personalBest = currentIndex;
            localStorage.setItem(getPlayerKey(), personalBest);
            document.getElementById('personalBest').textContent = personalBest;
        }

        sendScoreToTeacher(playerName, currentIndex);
        statusText.textContent = `GAME OVER! ${message} Score: ${currentIndex}. Deze poging wordt doorgestuurd naar de jury.`;
    }

    function resetGame() {
        currentIndex = 0;
        gameOver = false;
        inputField.disabled = false;
        nameInput.disabled = false;
        inputField.value = "";
        typedDisplay.textContent = "";
        statusText.textContent = "";
        inputField.focus();
    }

    function sendScoreToTeacher(name, score) {
        const formData = new FormData();
        formData.append(ENTRY_NAAM, name);
        formData.append(ENTRY_SCORE, score);

        fetch(GOOGLE_FORM_URL, {
            method: "POST",
            mode: "no-cors",
            body: formData
        }).catch(err => console.error("Verzenden mislukt:", err));
    }
</script>

</body>
</html>
